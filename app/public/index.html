<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLANT ROOM</title><link rel="stylesheet" href="/static/style.css?v=11"></head><body>
<div id="auth" class="auth"><div class="panel authbox"><h1>PLANT ROOM</h1><p>採取植物 × ピクセルルーム</p><input id="email" placeholder="email" value="demo@example.com"><input id="password" type="password" placeholder="password" value="demo123"><input id="display" placeholder="name" value="Player"><div class="row"><button onclick="register()">新規登録</button><button onclick="login()">ログイン</button></div><small id="authMsg"></small></div></div>
<div id="app" class="hidden"><header><div class="brand"><span class="brandMark"></span><b>PLANT ROOM</b></div><div class="headerMeta"><span id="aiBadge" class="aiBadge">AI --</span><span id="summary"></span><button class="mini" onclick="logout()">LOGOUT</button></div></header>
<main>
<section id="roomTab" class="tab active"><div id="room" class="room"><img class="room-bg" src="/static/assets/room_bg.png?v=11"><div id="entryDoor" class="entry-door" aria-hidden="true"><div class="entry-door-gap"></div><div class="entry-door-leaf"></div></div><div id="items"></div><img id="hero" class="hero" src="/static/assets/character.png"><div class="room-title">MY ROOM</div></div><div class="toolbar"><button class="iconBtn" onclick="openPlacement()"><img src="/static/assets/ui_extra/plus.png" alt="">EDIT ROOM</button><button class="iconBtn" onclick="showTab('waterTab')"><img src="/static/assets/ui_extra/watering_tab.png" alt="">WATER</button><button class="iconBtn" onclick="showTab('plantsTab')"><img src="/static/assets/ui_extra/plant_list_tab.png" alt="">PLANTS</button></div></section>
<section id="plantsTab" class="tab"><div class="panel"><div class="titleRow"><h2>植物一覧</h2><button id="addBtn" onclick="showTab('addTab')">＋ 登録</button></div><div id="plantList"></div></div></section>
<section id="waterTab" class="tab"><div class="panel"><div class="titleRow"><div><div class="eyebrow">TODAY</div><h2>今日の水やり</h2></div><div class="row"><button class="iconBtn" onclick="enableNotifications()"><img src="/static/assets/ui_extra/notification_bell.png" alt="">通知ON</button><button class="iconBtn" onclick="waterAll()"><img src="/static/assets/ui_extra/confirm.png" alt="">全部水やりした</button></div></div><div id="waterList"></div></div></section>
<section id="addTab" class="tab"><div class="panel addPanel"><div class="eyebrow">NEW SPECIMEN</div><h2>新しい植物</h2><p class="muted">PCから植物名・写真・個数を登録します。AI接続時は水やり・湿度・ドット絵まで自動作成します。</p><form id="addForm"><label>植物名<input name="name" required autocomplete="off"></label><label>個数<input name="count" type="number" min="1" max="99" value="1" required></label><label>写真<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label><button id="registerPlantBtn">AIに登録を任せる</button></form><div id="addMsg" class="processMsg"></div></div></section>
<section id="placeTab" class="tab"><div class="panel"><div class="titleRow"><h2>配置モード</h2><div class="row"><button onclick="goMoveFurniture()">家具を動かす</button><button onclick="finishPlacement()">配置終了</button></div></div><p class="muted">植物や家具を選び、部屋をクリックすると置けます。</p><h3>植物</h3><div id="inventory"></div><h3>家具</h3><div id="furnitureInventory" class="asset-strip"></div></div></section>
<section id="catalogTab" class="tab"><div class="panel"><div class="titleRow"><div><div class="eyebrow">ASSETS</div><h2>素材一覧</h2></div><button onclick="showTab('roomTab')">閉じる</button></div><div id="assetCatalog" class="catalog"></div></div></section>
</main><nav><button onclick="showTab('roomTab')"><img src="/static/assets/ui_extra/home_tab.png" alt="">ROOM</button><button onclick="showTab('waterTab')"><img src="/static/assets/ui_extra/watering_tab.png" alt="">WATER</button><button onclick="showTab('plantsTab')"><img src="/static/assets/ui_extra/plant_list_tab.png" alt="">PLANTS</button><button onclick="showTab('catalogTab')"><img src="/static/assets/ui_extra/info.png" alt="">ASSETS</button></nav></div>
<div id="itemMenu" class="itemMenu hidden"><button class="iconBtn" onclick="startMoveSelected()"><img src="/static/assets/ui/move.png" alt="">移動</button><button class="iconBtn" id="storeBtn" onclick="storeSelected()"><img src="/static/assets/ui/put_away.png" alt="">しまう</button><button id="colorBtn" onclick="cycleFurnitureColor()">色変更</button><button class="iconBtn" onclick="closeItemMenu()"><img src="/static/assets/ui_extra/close.png" alt="">閉じる</button></div><div id="toast"></div><script src="/static/app.js?v=11"></script></body></html>
